# 법률 코퍼스 선정 규칙 (M4-1). 기준은 docs/design/13-corpus-selection-definitions.md 의 D1~D13 이다.
#   uv run privframe-corpus select configs/corpus/selection.yaml --version v1
# 이 파일이 "목록 규칙"이다: 내용이 바뀌면 수집 목록의 버전 ID가 바뀐다(D12).
# 여기서 모은 원문은 색인하지 않는다(index: false). 무엇을 색인할지는 수집 뒤에 정한다.

basis_date: "2026-11-13"   # 수집 기준일: 법령 · 행정규칙은 이 날의 현행본(D6)

# ---------------------------------------------------------------------------------------------------------
# D1 · D2 · D3: 범위. 채점 모델에 그대로 준다.
scope:
  criterion: >-
    그 글이 영상의 가림 결정(무엇을, 어떻게, 어느 구간을, 어떤 예외로 가리는가)이나 그 근거 설명을 바꿀 수 있으면
    범위 안이고, 바꿀 수 없으면 범위 밖이다.
  questions:
    Q0: 어느 법 체계가 적용되나 (업무 목적의 개인정보처리자인가, 사적 촬영인가)
    # 보완: 문서에는 "촬영 위치 등 파일에 기록된 정보"가 없다. 시스템은 위치 태그의 유지 · 삭제를 이미 정하므로(15 §15.5) 넣었다.
    Q1: 이것이 개인정보인가 (얼굴, 전신, 번호판, 명찰, 여러 단서의 결합, 촬영 위치처럼 파일에 기록된 정보)
    Q2: 촬영과 수집이 허용되나 (고정형, 이동형, 공개된 장소)
    Q3: 공개와 제공이 허용되나 (제3자 제공, 목적 외 이용, 공개 범위)
    Q4: 동의는 어디까지인가 (촬영 동의와 공표 동의, 묵시적 동의, 동의한 범위를 넘는 이용)
    Q5: 더 보호되는 대상과 장소 (아동, 민감정보, 사생활이 드러나는 장소)
    Q6: 예외와 이익형량 (언론 · 공익, 증거 확보, 공적 인물)
    Q7: 어느 수준까지 가려야 하나 (가명 · 익명 처리, 가린 뒤에도 남는 식별 단서)
    Q8: 정보주체의 요청 (열람 · 제공 요청, 그때 다른 사람 부분을 가리는 일)
  out:    # 범위 밖(D3): 영상 가림 결정을 바꾸지 않는다
    - 음성 · 녹음만 다루는 것
    - 과징금 · 벌칙의 산정만 다루는 것 (위반 여부의 판단이 영상 · 촬영에 관한 것이면 범위 안)
    - 안전조치 · 유출 통지
    - 국외이전 · 위탁
    - 가명정보 결합 절차
    - 분쟁조정 절차
    - 저작권
    - 외국법
  hold:   # 보류(D3): 해당 시나리오가 생기면 넣는다
    - 범죄 피해자 · 소년의 신원 보도 금지 조항
    # 경계: 일반인의 초상을 광고 · 홍보에 쓴 사건은 보류가 아니라 Q4(동의 범위)다. 보류는 유명인의 재산적 이익만이다.
    - 유명인의 초상 · 성명이 갖는 재산적 가치(퍼블리시티권)의 상업적 이용

# ---------------------------------------------------------------------------------------------------------
# D4 · D5 · D6 · D8: 규범과 참고 자료는 목록으로 정한다(판례처럼 탐색하지 않는다).
#   원문은 법령 전체를 받고(자르지 않는다), 채택 단위는 조문이다. articles 가 없으면 전 조문을 채택한다.
#   조문마다 같은 채점을 해서 어느 질문에 닿는지 기록한다(채택 여부는 이 목록이 정한다).
norms:
  - {id: pipa, target: law, name: 개인정보 보호법, authority: 1}
  - {id: pipa-decree, target: law, name: 개인정보 보호법 시행령, authority: 1}
  - {id: standard-guideline, target: admrul, name: 표준 개인정보 보호지침, authority: 1}
  # 7절 ①-A: 연결 조문. 사적 촬영(Q0)과 언론 · 공익 예외(Q6)의 근거
  - {id: constitution, target: law, name: 대한민국헌법, authority: 1, articles: [제10조, 제17조, 제21조], decision: "①-A"}
  - {id: civil-act, target: law, name: 민법, authority: 1, articles: [제750조, 제751조], decision: "①-A"}
  - {id: press-arbitration-act, target: law, name: 언론중재 및 피해구제 등에 관한 법률, authority: 1, articles: [제5조], decision: "①-A"}
  # 보완 제안(문서에 없음): 위치 태그 판단의 근거. 빼려면 이 줄을 지운다.
  - {id: location-act, target: law, name: 위치정보의 보호 및 이용 등에 관한 법률, authority: 1, articles: [제2조, 제15조], decision: "보완 제안"}

guides:   # 권위 3. 개인정보위 게시판은 자동 요청을 막아, 사람이 받아 data/corpus/inbox/ 에 둔 파일만 쓴다(없으면 미확보로 기록)
  - {id: guide-fixed-camera-2024-12, kind: guideline, title: 고정형 영상정보처리기기 설치·운영 안내서 (2024.12), path: data/corpus/inbox/고정형_영상정보처리기기_안내서_2024.12.pdf, page: "https://www.pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS217&mCode=G010030000&nttId=10901", published_at: "2024-12"}
  - {id: guide-mobile-camera-2024-09, kind: guideline, title: 이동형 영상정보처리기기를 위한 개인영상정보 보호·활용 안내서 (2024.9), path: data/corpus/inbox/이동형_영상정보처리기기_안내서_2024.9.pdf, page: "https://pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS217&mCode=G010030000&nttId=10679", published_at: "2024-09"}
  # 아래 다섯은 아직 없다. 받는 곳은 2026-11-13에 브라우저로 열어 제목을 확인했다. 받아서 path 의 이름으로 두고 select 를 다시 실행한다.
  - {id: guide-pseudonym, kind: guideline, title: 가명정보 처리 가이드라인 (2026.3), path: data/corpus/inbox/가명정보_처리_가이드라인.pdf, page: "https://www.pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS217&mCode=G010030000&nttId=11931", published_at: "2026-03"}
  - {id: guide-children, kind: guideline, title: 아동·청소년 개인정보 보호 안내서 (2024.12), path: data/corpus/inbox/아동청소년_개인정보_보호_안내서.pdf, page: "https://www.pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS217&mCode=G010030000&nttId=10896", published_at: "2024-12"}
  - {id: guide-biometric, kind: guideline, title: 생체정보 보호 안내서 (2024.12), path: data/corpus/inbox/생체정보_보호_안내서.pdf, page: "https://www.pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS217&mCode=G010030000&nttId=10900", published_at: "2024-12"}
  - {id: mediation-cases, kind: mediation, title: 2025년 개인정보 분쟁조정 사례집, path: data/corpus/inbox/분쟁조정_사례집.pdf, page: "https://www.pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS232&mCode=D070010020&nttId=12104", published_at: "2026-05"}
  - {id: pipc-precedents, kind: casebook, title: 개인정보보호 판례집 (개인정보위), path: data/corpus/inbox/개인정보_보호_판례집.pdf, page: "https://www.pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS231&mCode=D070010010&nttId=7940", published_at: "2022-03"}

# 국가법령정보 API 에 없는 판결(원심 · 제1심 · 환송 후 판결)은 사람이 법원의 판결서 열람으로 받아
#   data/corpus/inbox/judgments/<법원>_<사건번호>.pdf   (예: 서울서부지방법원_2019나38288.pdf)
# 로 두면 select 가 경과 확인용 원문으로 가져간다. 환송 후 판결은 본문에 환송판결의 사건번호가 있으면 스스로 연결된다.

# ---------------------------------------------------------------------------------------------------------
# D9: 사례를 찾는 경로. 검색은 모두 국가법령정보 API 이고, 검색마다 조건 · 건수 · 시각을 기록한다.
#   문서의 D9 는 판례만 적었다. 헌재 결정 · 해석례 · 결정문도 같은 경로(①③④)로 찾는다.
paths:
  # ① 기관이 고른 목록: 확보한 안내서 · 결정문 · 해석례의 본문에 나오는 사건번호 (판례집 PDF는 받아 두면 같이 쓴다)
  institution: {from_kinds: [guideline, mediation, casebook]}
  # ② 참조조문: 이 법령을 참조한 판례. 구법 이름은 옛 판례를 놓치지 않으려고 넣었다(현행 조문과의 대응은 미확인으로 남는다)
  statute_refs:
    prec: [개인정보 보호법, 공공기관의 개인정보보호에 관한 법률]
  # ③ 주제어 (본문 검색). API 는 낱말을 느슨하게 맞추므로(2026-11-13 실측: "개인영상정보" 504건 중 그 낱말이 없는 것이 다수)
  #    받아 온 원문에서 낱말이 실제로 있는지 다시 본다(screen.words).
  keywords:
    prec:
      - 초상권
      - 개인영상정보
      - 영상정보처리기기
      - CCTV 열람
      - 촬영 동의
      - 블랙박스
      # 아래는 보완(문서의 "등"): 같은 주제의 다른 표기와, 가림 대상(얼굴 · 번호판 · 위치)을 직접 가리키는 말
      - 폐쇄회로
      - CCTV
      - 초상
      - 모자이크
      - 얼굴 공개
      - 번호판
      - 위치정보
    detc: [영상정보처리기기, 개인영상정보, CCTV, 폐쇄회로, 초상권, 촬영, 블랙박스]
    expc: [영상정보처리기기, 개인영상정보, CCTV, 폐쇄회로, 촬영, 블랙박스, 얼굴]
    ppc: [영상정보처리기기, 개인영상정보, CCTV, 폐쇄회로, 촬영, 블랙박스, 얼굴]
  # ④ 인용 따라가기: 채택 판례가 인용한 판례와, 그 판례를 인용한 이후 판례. 두 단계까지, 새 채택이 없으면 끝
  #    피인용은 사건번호로 본문을 검색해 찾는데, 이 검색도 느슨하다(실측: "2007다71" 1,855건). 결과가 max_mentions 를 넘으면
  #    사건번호와 무관한 것까지 맞춘 것이므로 쓰지 않고, 그보다 적어도 원문에 그 사건번호가 있을 때만 인용으로 친다.
  citations: {rounds: 2, max_mentions: 300}
  # D10: 어떤 질문에 한쪽 방향의 사례만 있으면 이 말로 한 번 더 찾는다(한 번만)
  widen:
    Q0: [개인정보처리자, 사적인 목적 촬영]
    Q1: [개인을 알아볼 수 있는 정보, 차량등록번호 개인정보]
    Q2: [영상정보처리기기 설치, 공개된 장소 촬영]
    Q3: [제3자 제공 영상, 공개된 개인정보]
    Q4: [초상 사용 동의, 묵시적 동의 촬영]
    Q5: [아동 촬영, 사생활의 비밀 촬영]
    Q6: [위법성 조각 초상, 공적 인물 초상, 증거 수집 촬영]
    Q7: [가명처리 영상, 익명처리]
    Q8: [개인영상정보 열람, 정보주체 열람 청구]
  max_hits_per_search: 1000   # 넘으면 앞에서부터 이만큼만 보고, 잘랐다고 기록한다

# ---------------------------------------------------------------------------------------------------------
# D10 1단계: 규칙 거르기
screen:
  case_types: [민사, 형사, 일반행정, 가사, 헌법]   # 사건 종류. 세무 · 특허는 본다고 달라질 것이 없어 뺀다
  # 주제어 검색(③)으로 찾은 후보는 이 낱말이 판시사항 · 요지 · 이유에 실제로 있어야 통과한다.
  # 참조조문(②)과 인용(①④)으로 찾은 후보는 찾은 경로가 근거이므로 낱말을 요구하지 않는다.
  words: [초상, 영상정보처리기기, 개인영상정보, 폐쇄회로, CCTV, 씨씨티브이, 블랙박스, 촬영, 영상, 사진, 얼굴, 모자이크, 번호판, 위치정보]

# ---------------------------------------------------------------------------------------------------------
# D10 2단계: 관련성 채점 (7절 ④-A: 경량 모델이 전부, 상위 모델이 일부를 다시 본다)
grading:
  # 점수의 뜻. 문서는 "엄격 / 완화"만 적었고 수치가 없어 여기서 정했다.
  scale:
    3: 이 글의 판단(조문이면 규정 내용)을 알면 가림 결정이나 그 근거 설명이 달라질 수 있다. 그 질문의 판단 기준이나 결론을 직접 밝혔다
    2: 같은 쟁점을 다루지만 가림 결정에 쓰려면 유추가 필요하다 (다른 종류의 정보나 절차에 대한 판단)
    1: 관련 낱말이나 조문이 나오지만 그 쟁점에 대한 판단은 없다 (영상이 증거로만 나오는 경우 등)
  model: claude-haiku-5-5-api          # 카탈로그 llm.analyst 의 경량(efficient) 후보
  check_model: claude-sonnet-5-5-api   # 상위(frontier) 후보
  slot: llm.analyst
  # 상위 모델이 다시 보는 것: 경량 모델이 2점 이상 준 것 전부(채택 경계)와, 나머지에서 무작위로 고른 비율
  check_sample: 0.15
  seed: 20261113
  # 무작위 표본에서 두 모델의 채택 판정이 이 비율보다 자주 갈리면 전부를 상위 모델로 다시 채점한다(④의 "자주 갈리면 B")
  escalate_above: 0.10
  max_chars: 150000        # 이보다 긴 원문은 앞부분만 읽고 채점하고, 일부만 읽었다고 기록한다
  parallel: 6
  cost_cap_usd: 15.0       # 넘으면 채점을 멈추고, 남은 후보는 "채점 못 함"으로 남긴다

# ---------------------------------------------------------------------------------------------------------
# D12: 수집 목록의 버전. v1 은 7절의 제안(①-A ②-A ③-A ④-A)대로다.
versions:
  v1:
    courts: [대법원]                 # 주요 채택 대상인 법원 (헌재 결정은 따로 kinds 로 본다). ②-A
    min_score: {prec: 3, detc: 3, expc: 3, ppc: 3}   # "엄격"
    about_images_only: [expc, ppc]   # 해석례 · 결정문은 영상 관련만
    trail: true                      # ③-A: 채택 판결의 원심 · 제1심 · 환송 후 판결을 경과 확인용으로 찾는다
  v2:
    courts: all                      # 일반 하급심 후보 포함
    min_score: {prec: 2, detc: 2, expc: 2, ppc: 2}   # "완화"
    about_images_only: [expc, ppc]
    trail: true

# ---------------------------------------------------------------------------------------------------------
# 문서(D2)가 예로 든 것. 수집 뒤에 실제 원문 · 채점과 맞는지 자동으로 대조한다(채택을 강제하지 않는다).
expect:
  cases:
    - {case: "2021다219116", question: Q4}
    - {case: "2020다227455", question: Q6}
    - {case: "2020다253423", question: Q6}
    - {case: "2015헌마994", question: Q8}
