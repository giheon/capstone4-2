  - id: render
    label: 렌더
    description: 원본 스트림에 결정을 입힌다. 영상만 재인코딩하고 오디오 · 자막 · 메타데이터는 바이트 복사한다.
    slots:
      - id: render.encoder
        label: 영상 인코더
        used_by: [render_original, verify_output]
        adapters: [pyav]
        default: x264-crf16
        candidates:
          - id: x264-crf16
            label: libx264 CRF 16 · slow
            short: x264 CRF 16
            adapter: pyav
            ref: libx264 crf=16 preset=slow (원본 profile · level · pix_fmt)
            license: GPL-2.0-or-later (x264)
            note: 기본. HEVC · 10-bit · HDR 원본은 libx265로 자동 전환 (설계 §6.2)
          - id: x264-crf14
            label: libx264 CRF 14 · slow
            short: x264 CRF 14
            adapter: pyav
            ref: libx264 crf=14 preset=slow
            license: GPL-2.0-or-later (x264)
            note: 품질 우선 · 파일이 커짐. 마스크 밖 PSNR 임계(U9)는 M4 측정으로 38 dB
          - id: videotoolbox
            label: h264_videotoolbox (Apple 하드웨어)
            short: VideoToolbox
            adapter: pyav
            ref: h264_videotoolbox q:v
            note: 빠름 · 상수 품질은 Apple Silicon 전용 · HDR 메타 처리는 미확인 (R7)
          - id: ffv1
            label: FFV1 무손실
            adapter: pyav
            ref: ffv1 level=3
            status: planned
            note: M6 · 파일이 매우 커짐 (R7)

