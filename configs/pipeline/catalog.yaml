# PrivFrame 파이프라인 부품 카탈로그
#
# 프로필은 아래 부품(slot)마다 후보(candidate)를 하나씩 고른 조합이다 (configs/pipeline/profiles/*.yaml).
# 실험실 > 프로필에서 고르고, 실험실 > 모델 후보에서 이 목록을 본다. M4 백엔드도 같은 파일을 읽는다.
#
# 후보를 추가하는 두 가지 방법
#   1. 이 파일: 해당 slot의 candidates 끝에 항목을 붙이고 저장한다. 서버 재시작 없이 화면을 새로고침하면 보인다.
#   2. 실험실 > 모델 후보 > 후보 추가: 이미 등록된 어댑터 계열이면 화면에서 바로 추가되고, 이 파일 끝에 기록된다
#      (source: lab). OpenRouter 모델은 slug만 넣으면 가격·입력 형식·도구 지원을 OpenRouter 공개 목록에서 채운다.
#   새 계열(예: 구조가 다른 검출기)은 adapters에 없으면 쓸 수 없다. 코드에 어댑터를 구현한 뒤 adapters에 등록한다.
#
# 후보 필드
#   id       slot 안에서 유일한 키. 프로필이 이 값을 참조하므로 바꾸지 않는다.
#   label    화면 이름 (short: 토폴로지 노드에 쓰는 짧은 이름)
#   adapter  아래 adapters의 키
#   ref      어댑터가 불러올 대상 (OpenRouter slug, Hugging Face 저장소, 가중치·클래스 이름)
#   license  로컬 가중치·코드의 라이선스. AGPL·비상용이면 프로필 검사에서 경고한다
#   price    API 단가, USD / 1M 토큰 {in, out}. 로컬 실행은 생략(0)
#   caps     tools(도구 호출) · json(엄격한 JSON 스키마 출력) · image · video
#   tier     LLM 등급 frontier(상위) | efficient(경량). M2 모의 실행이 동작을 바꾸는 데도 쓴다
#   lawirko  임베딩의 LawIRKo nDCG@10 (조문 검색 공개 벤치마크)
#   status   planned = 아직 구현 전이라 고를 수 없음
#   note     근거 한 줄. (R1)~(R7)은 docs/research 문서, 가격은 2026-11-06 OpenRouter 공개 목록 기준
#            (anthropic 어댑터 후보는 Anthropic API 정가, 2026-10-06 기준)

version: 1

adapters:
  openrouter: {label: OpenRouter, kind: api, ref: "OpenRouter 모델 slug", example: "anthropic/claude-sonnet-5.5", lookup: openrouter}
  anthropic: {label: Anthropic API (직접), kind: api, ref: "Claude 모델 ID", example: "claude-sonnet-5-5"}
  gemini-api: {label: Gemini API (직접), kind: api, ref: "Gemini 모델 이름", example: "gemini-3.8-flash"}
  openai-embeddings: {label: OpenAI 임베딩 API, kind: api, ref: "임베딩 모델 이름", example: "text-embedding-3-small"}
  mlx-vlm: {label: mlx-vlm (로컬 VLM), kind: local, ref: "Hugging Face 저장소 (MLX 변환본)", example: "mlx-community/Qwen3-VL-8B-Instruct-4bit"}
  sentence-transformers: {label: sentence-transformers, kind: local, ref: "Hugging Face 저장소", example: "nlpai-lab/KURE-v1"}
  cross-encoder: {label: CrossEncoder 리랭커, kind: local, ref: "Hugging Face 저장소", example: "nlpai-lab/KURE-Reranker-nano"}
  rfdetr: {label: rfdetr, kind: local, ref: "가중치 이름", example: "rf-detr-nano"}
  transformers-detection: {label: transformers 검출 모델, kind: local, ref: "Hugging Face 저장소", example: "ustc-community/dfine-small-coco"}
  ultralytics: {label: Ultralytics, kind: local, ref: "가중치 파일", example: "yolo26n.pt"}
  efficienttam: {label: EfficientTAM, kind: local, ref: "체크포인트 이름", example: "efficienttam_s_512x512"}
  opencv-dnn: {label: OpenCV DNN, kind: local, ref: "OpenCV Zoo ONNX 파일", example: "face_detection_yunet_2023mar.onnx"}
  onnx: {label: ONNX Runtime, kind: local, ref: "ONNX 파일 또는 저장소", example: "retinaface_mv2.onnx"}
  adaface: {label: AdaFace, kind: local, ref: "체크포인트 이름", example: "adaface_ir50_webface4m"}
  trackers: {label: roboflow/trackers, kind: local, ref: "추적기 이름", example: "botsort"}
  open-image-models: {label: open-image-models, kind: local, ref: "모델 이름", example: "yolo-v9-t-384-license-plate-end2end"}
  rapidocr: {label: RapidOCR, kind: local, ref: "det=검출 모델 rec=인식 모델", example: "det=PP-OCRv6_det_tiny rec=korean_PP-OCRv5_rec_mobile"}
  scenedetect: {label: PySceneDetect, kind: local, ref: "검출기 클래스", example: "AdaptiveDetector"}
  kiwi: {label: Kiwi + bm25s, kind: local, ref: "형태소 분석기 버전", example: "kiwipiepy 0.24.1"}
  vector-store: {label: 벡터 저장소, kind: local, ref: "저장소 종류", example: "chroma"}
  pyav: {label: PyAV 인코더, kind: local, ref: "codec · crf · preset", example: "libx264 crf=16 preset=slow"}
  builtin: {label: 코드에 구현된 방식, kind: builtin, ref: "코드 위치", addable: false}
  option: {label: 설정값, kind: option, ref: "", addable: false}
  none: {label: 사용 안 함, kind: option, ref: "", addable: false}

stages:
  - id: perception
    label: 지각
    description: 원본에서 사람·글자·번호판을 찾고 추적한다. 결정적 도구라 같은 입력이면 같은 결과를 낸다.
    slots:
      - id: perception.scene_cut
        label: 장면 경계
        used_by: [perceive/detect_track, perceive/describe_segments]
        adapters: [scenedetect]
        default: adaptive
        candidates:
          - id: adaptive
            label: PySceneDetect AdaptiveDetector
            short: Adaptive 컷
            adapter: scenedetect
            ref: AdaptiveDetector
            license: BSD-3-Clause
            note: 1.0 때부터 쓰는 검출기. 컷마다 트랙을 새로 시작한다.
          - id: content
            label: PySceneDetect ContentDetector
            short: Content 컷
            adapter: scenedetect
            ref: ContentDetector
            license: BSD-3-Clause
            note: 고정 임계값 방식. AdaptiveDetector는 빠른 카메라 이동에서 오검출을 줄인 변형이다.

      - id: perception.face_detector
        label: 얼굴 검출
        used_by: [perceive/detect_track]
        adapters: [opencv-dnn, onnx]
        default: yunet
        candidates:
          - id: yunet
            label: YuNet 2023mar
            adapter: opencv-dnn
            ref: face_detection_yunet_2023mar.onnx
            license: MIT
            note: WIDER FACE Hard 0.708~0.750 · 233 kB · i7-12700K 0.69 ms (R2a)
          - id: retinaface-mnv2
            label: RetinaFace MobileNetV2
            adapter: onnx
            ref: yakhyo/retinaface-pytorch mobilenetv2
            license: MIT
            note: WIDER FACE Hard 83.59 (원 해상도) · 사전학습 ONNX 제공 (R2a)
          - id: scrfd-2.5g
            label: SCRFD-2.5GF
            adapter: onnx
            ref: insightface scrfd_2.5g_kps
            license: 비상용 연구 전용 (가중치)
            note: WIDER FACE Hard 77.13 · 코드 MIT, 가중치는 비상용 (R2a)

      - id: perception.object_detector
        label: 사람 · 물체 검출
        used_by: [perceive/detect_track]
        adapters: [rfdetr, open-image-models, transformers-detection, ultralytics]
        default: rfdetr-nano
        candidates:
          - id: rfdetr-nano
            label: RF-DETR Nano
            adapter: rfdetr
            ref: rf-detr-nano
            license: Apache-2.0
            note: COCO 48.4 · Apple M3 Pro CoreML fp16 20.8 ms (R2b)
          - id: rfdetr-nano-onnx
            label: RF-DETR Nano (ONNX)
            short: RF-DETR Nano ONNX
            adapter: open-image-models
            ref: rf-detr-nano-384-coco
            license: Apache-2.0
            note: M3 측정 CPU 12 fps에서 1분 영상당 36.9 s (PyTorch판 약 49 s). torch 없이 ONNX Runtime으로 실행
          - id: rfdetr-small
            label: RF-DETR Small
            adapter: rfdetr
            ref: rf-detr-small
            license: Apache-2.0
            note: COCO 53.0 · T4 3.5 ms · Nano보다 느림 (R2b)
          - id: dfine-s
            label: D-FINE-S
            adapter: transformers-detection
            ref: ustc-community/dfine-small-coco
            license: Apache-2.0
            note: COCO 48.5 · HF transformers 지원. Obj365 체크포인트는 상업 사용 미확인 (R2b)
          - id: yolo26n
            label: YOLO26n
            adapter: ultralytics
            ref: yolo26n.pt
            license: AGPL-3.0
            note: COCO 40.9 · CPU ONNX 38.9 ms · 코드와 가중치 모두 AGPL (R2b)

      - id: perception.segmenter
        label: 윤곽 마스크
        used_by: [perceive/detect_track, render_original]
        adapters: [rfdetr, efficienttam, none]
        default: rfdetr-seg-nano
        candidates:
          - id: rfdetr-seg-nano
            label: RF-DETR-Seg Nano
            adapter: rfdetr
            ref: rf-detr-seg-nano
            license: Apache-2.0
            note: 마스크 AP 40.3 · Apple M3 Pro CPU+NE 23.5 ms (R2b)
          - id: efficienttam-s
            label: EfficientTAM-S (키프레임 마스크 전파)
            short: EfficientTAM-S
            adapter: efficienttam
            ref: efficienttam_s_512x512
            license: Apache-2.0
            note: SA-V 71.5 (S@512) · iPhone 15 Pro Max 80.6 ms/프레임 · Mac MPS 지원 (R2d)
          - id: none
            label: 사용 안 함 (타원 · 박스만)
            short: 마스크 없음
            adapter: none
            note: 윤곽 처리를 쓸 수 없어 과잉 가림 권고를 고칠 수 없다.

      - id: perception.tracker
        label: 추적
        used_by: [perceive/detect_track]
        adapters: [trackers, builtin]
        default: botsort
        candidates:
          - id: botsort
            label: BoT-SORT
            adapter: trackers
            ref: botsort
            license: Apache-2.0
            note: roboflow/trackers 2.6.1 · HOTA 63.7 (패키지 자체 측정) (R2e)
          - id: cbiou
            label: C-BIoU
            adapter: trackers
            ref: cbiou
            license: Apache-2.0
            note: HOTA 63.0 · 움직임만 사용 (R2e)
          - id: bytetrack
            label: ByteTrack
            adapter: trackers
            ref: bytetrack
            license: Apache-2.0
            note: HOTA 60.1 · 움직임만 사용 (R2e)
          - id: iou-legacy
            label: 기존 IoU 추적
            adapter: builtin
            ref: core/perception/tracking.py
            note: 1.0의 추적 방식 (IoU 0.3 · 최대 간격 2). 베이스라인 비교용

      - id: perception.face_embedding
        label: 인물 묶음 (얼굴 특징)
        used_by: [perceive/group_identities]
        adapters: [opencv-dnn, adaface, onnx]
        default: sface
        candidates:
          - id: sface
            label: SFace 2021dec
            adapter: opencv-dnn
            ref: face_recognition_sface_2021dec.onnx
            license: Apache-2.0
            note: LFW 0.9940 · i7-12700K 5.09 ms. 특징 벡터는 케이스 완료 시 삭제 (R2a)
          - id: adaface-ir50
            label: AdaFace IR-50 (WebFace4M)
            short: AdaFace IR-50
            adapter: adaface
            ref: adaface_ir50_webface4m
            license: MIT
            note: IJB-C 96.98 (R2a)
          - id: arcface-w600k
            label: ArcFace w600k_r50 (기존)
            short: ArcFace (기존)
            adapter: onnx
            ref: insightface buffalo_l w600k_r50
            license: 비상용 연구 전용 (가중치)
            note: 1.0이 쓰던 묶음 모델. 가중치가 비상용이라 서비스 전 교체 대상 (R2a)

      - id: perception.plate_detector
        label: 번호판 검출
        used_by: [perceive/detect_track]
        adapters: [open-image-models, none]
        default: yolo-v9-t-384
        candidates:
          - id: yolo-v9-t-384
            label: open-image-models yolo-v9-t-384
            short: 번호판 v9-t
            adapter: open-image-models
            ref: yolo-v9-t-384-license-plate-end2end
            license: MIT
            note: P 0.942 · R 0.863 · mAP50 0.92 · 학습 데이터 미공개 (R2g)
          - id: yolo-v9-s-608
            label: open-image-models yolo-v9-s-608
            short: 번호판 v9-s
            adapter: open-image-models
            ref: yolo-v9-s-608-license-plate-end2end
            license: MIT
            note: P 0.957 · R 0.917 · mAP50 0.966 (R2g)
          - id: none
            label: 사용 안 함
            adapter: none
            note: 번호판을 찾지 않는다. 감사자가 번호판을 지적해도 처리할 트랙이 없다.

      - id: perception.ocr
        label: 글자 인식 (OCR)
        used_by: [perceive/ocr]
        adapters: [rapidocr, gemini-api]
        default: rapidocr-tiny
        candidates:
          - id: rapidocr-tiny
            label: RapidOCR · PP-OCRv6 det tiny + 한국어 PP-OCRv5 rec
            short: RapidOCR tiny
            adapter: rapidocr
            ref: det=PP-OCRv6_det_tiny rec=korean_PP-OCRv5_rec_mobile
            license: Apache-2.0
            note: Apple M4 ONNX Runtime 검출+인식 0.35 s/장 · 한국어 인식 88.0% (PaddleOCR 문서) (R2f)
          - id: rapidocr-small
            label: RapidOCR · PP-OCRv6 det small + 한국어 PP-OCRv5 rec
            short: RapidOCR small
            adapter: rapidocr
            ref: det=PP-OCRv6_det_small rec=korean_PP-OCRv5_rec_mobile
            license: Apache-2.0
            note: Apple M4 1.29 s/장 · 검출 Hmean 84.1 (tiny 80.6) (R2f)
          - id: gemini-3.8-flash
            label: VLM OCR · Gemini 3.8 Flash
            short: Gemini OCR
            adapter: gemini-api
            ref: gemini-3.8-flash
            price: {in: 0.75, out: 3.75}
            caps: [json, image, video]
            note: 한국어 문서 WER 4.85 (Gemini-3-Flash 기준) · 프레임이 외부로 나감 (R1)

  - id: scene
    label: 장면 이해 (VLM)
    description: 장면 설명 · 인물 속성 · 시각 재점검. 클라우드 VLM이면 프레임이 외부로 나가므로 입력 방식과 함께 고른다.
    slots:
      - id: vlm.input_mode
        label: VLM 입력 방식
        used_by: [perceive/describe_segments, perceive/describe_persons]
        adapters: [option]
        default: v2
        candidates:
          - id: v2
            label: V-2 축소 + 얼굴 익명화 후 전송
            adapter: option
            note: 기본. 얼굴 픽셀은 보내지 않는다 (설계 §7.3)
          - id: v1
            label: V-1 원본 프레임 (ZDR · 동의 영상만)
            adapter: option
            note: 품질 상한 측정용. 동의받은 출연자나 합성 영상에만 쓴다.
          - id: v3
            label: V-3 로컬 VLM만
            adapter: option
            note: 프레임이 컴퓨터 밖으로 나가지 않는다. VLM 부품을 모두 로컬 후보로 골라야 한다.

      - id: vlm.scene
        label: 장면 설명
        used_by: [perceive/describe_segments]
        adapters: [openrouter, anthropic, gemini-api, mlx-vlm]
        requires: [json]
        default: qwen3.6-35b-a3b
        candidates:
          - id: qwen3.6-35b-a3b
            label: Qwen3.6-35B-A3B
            adapter: openrouter
            ref: qwen/qwen3.6-35b-a3b
            price: {in: 0.10, out: 0.90}
            caps: [tools, json, image, video]
            license: Apache-2.0
            note: Video-MME 86.6 · OpenRouter video_url 입력 (R1)
          - id: gemini-3.8-flash
            label: Gemini 3.8 Flash
            adapter: gemini-api
            ref: gemini-3.8-flash
            price: {in: 0.75, out: 3.75}
            caps: [tools, json, image, video]
            note: 네이티브 영상 1 FPS · Files API · 유료 티어는 학습에 쓰지 않음 (R1)
          - id: qwen3.6-27b
            label: Qwen3.6-27B
            adapter: openrouter
            ref: qwen/qwen3.6-27b
            price: {in: 0.32, out: 3.2}
            caps: [tools, json, image, video]
            license: Apache-2.0
            note: Video-MME 87.7 (R1) · 단가는 2026-11-11 OpenRouter 목록 (11-06에는 $0.45 / $2.70)
          - id: qwen3-vl-8b-mlx
            label: Qwen3-VL-8B (로컬 · 4-bit)
            short: Qwen3-VL-8B 로컬
            adapter: mlx-vlm
            ref: mlx-community/Qwen3-VL-8B-Instruct-4bit
            caps: [json, image, video]
            license: Apache-2.0
            note: 약 5.8 GB · 프레임이 외부로 나가지 않음 · 클립당 수십 초. 저장소 존재 확인 2026-11-06 (R1)
          - id: glm-4.6v
            label: GLM-4.6V
            adapter: openrouter
            ref: z-ai/glm-4.6v
            price: {in: 0.30, out: 0.90}
            caps: [tools, image, video]
            license: MIT
            note: OpenRouter에서 엄격한 JSON 스키마 출력 미지원 → 장면 JSON 계약을 보장하지 못함 (R1)
          - id: claude-opus-5-5-api
            label: Claude Opus 5.5 · Anthropic API
            short: Opus 5.5 API
            adapter: anthropic
            ref: claude-opus-5-5
            price: {in: 4, out: 20}
            caps: [tools, json, image]
            tier: frontier
            note: Anthropic API 직접 호출 (ANTHROPIC_API_KEY). 사고를 끌 수 없어 effort로 조절한다.
          - id: claude-sonnet-5-5-api
            label: Claude Sonnet 5.5 · Anthropic API
            short: Sonnet 5.5 API
            adapter: anthropic
            ref: claude-sonnet-5-5
            price: {in: 2, out: 10}
            caps: [tools, json, image]
            tier: frontier
            note: Anthropic API 직접 호출 (ANTHROPIC_API_KEY). OpenRouter의 같은 모델과 경로만 다르다.
          - id: claude-haiku-5-5-api
            label: Claude Haiku 5.5 · Anthropic API
            short: Haiku 5.5 API
            adapter: anthropic
            ref: claude-haiku-5-5
            price: {in: 0.10, out: 0.50}
            caps: [tools, json, image]
            tier: efficient
            note: Anthropic API 직접 호출 (ANTHROPIC_API_KEY). 프롬프트 10만 토큰 이하 단가.

      - id: vlm.person
        label: 인물 속성
        used_by: [perceive/describe_persons]
        adapters: [openrouter, anthropic, gemini-api, mlx-vlm]
        requires: [json]
        default: qwen3.6-35b-a3b
        candidates:
          - id: qwen3.6-35b-a3b
            label: Qwen3.6-35B-A3B
            adapter: openrouter
            ref: qwen/qwen3.6-35b-a3b
            price: {in: 0.10, out: 0.90}
            caps: [tools, json, image, video]
            license: Apache-2.0
