  - id: retrieval
    label: 법률 검색 (RAG)
    description: search_law 도구가 쓰는 검색 방식. 코퍼스 색인은 이 설정의 fingerprint로 고정된다.
    slots:
      - id: rag.chunking
        label: 청킹
        used_by: [legal_analyst/search_law, auditor/search_law]
        adapters: [builtin]
        default: article-prefix
        candidates:
          - id: article-prefix
            label: 조문 · 섹션 단위 + 계층 접두어
            short: 조문 단위
            adapter: builtin
            ref: 법령=조 · 판례=판시사항/판결요지 · 800토큰 초과 시 항 단위
            note: 설계 §9.3 · SearchFireSafety 근거 (R3)
          - id: contextual
            label: 조문 단위 + 문맥 문장 (Contextual Retrieval)
            short: 문맥 청크
            adapter: builtin
            ref: 청크마다 LLM이 문맥 문장 생성
            note: 색인할 때 LLM 비용이 든다. 실험 변수 (R3)
          - id: fixed-1200
            label: 고정 길이 1200 / 겹침 150 (기존)
            short: 1200자 청크
            adapter: builtin
            ref: core/retrieval.py
            note: 1.0의 청킹 설정. 비교용

      - id: rag.embedding
        label: 임베딩
        used_by: [legal_analyst/search_law, auditor/search_law]
        adapters: [sentence-transformers, openai-embeddings]
        default: kure-v1
        candidates:
          - id: kure-v1
            label: KURE-v1
            adapter: sentence-transformers
            ref: nlpai-lab/KURE-v1
            license: MIT
            lawirko: 0.743
            note: 568M · 1024차원 · 한국어 9과제 평균 0.762 (R3)
          - id: kure-v3
            label: KURE-v3
            adapter: sentence-transformers
            ref: nlpai-lab/KURE-v3
            license: Apache-2.0
            lawirko: 0.816
            note: "1.1B · query:/passage: 접두어 필요 · 9과제 0.803 (R3)"
          - id: qwen3-embedding-8b
            label: Qwen3-Embedding-8B
            adapter: sentence-transformers
            ref: Qwen/Qwen3-Embedding-8B
            license: Apache-2.0
            lawirko: 0.817
            note: 4096차원 · 9과제 0.783 (R3)
          - id: bge-m3
            label: BGE-M3
            adapter: sentence-transformers
            ref: BAAI/bge-m3
            license: MIT
            lawirko: 0.717
            note: 9과제 0.751 (R3)
          - id: openai-3-small
            label: OpenAI text-embedding-3-small (기존)
            short: OpenAI 3-small
            adapter: openai-embeddings
            ref: text-embedding-3-small
            price: {in: 0.02, out: 0}
            note: 1.0의 설정. 공개 한국어 점수 없음 (3-large는 8과제 0.617) (R3)

      - id: rag.retrieval
        label: 검색 방식
        used_by: [legal_analyst/search_law, auditor/search_law]
        adapters: [builtin]
        default: hybrid-rrf
        candidates:
          - id: hybrid-rrf
            label: 하이브리드 (dense + BM25, RRF)
            short: 하이브리드
            adapter: builtin
            ref: EnsembleRetriever 가중 RRF
            note: 로컬 Chroma에는 BM25가 없어 앱에서 결합한다 (R3)
          - id: dense
            label: dense만
            adapter: builtin
            ref: 벡터 검색
          - id: bm25
            label: BM25만
            adapter: builtin
            ref: 형태소 BM25

      - id: rag.bm25_tokenizer
        label: BM25 토크나이저
        used_by: [legal_analyst/search_law, auditor/search_law]
        adapters: [kiwi, builtin]
        default: kiwi
        candidates:
          - id: kiwi
            label: Kiwi 형태소 (kiwipiepy + bm25s)
            short: Kiwi BM25
            adapter: kiwi
            ref: kiwipiepy 0.24.1
            license: Apache-2.0 · bm25s MIT
            note: 법률 용어 사용자 사전 지원 · Apple Silicon 휠 제공 (R3)
          - id: whitespace
            label: 공백 분리
            adapter: builtin
            ref: str.split
            note: 비교용. 조사가 붙은 어절이 서로 다른 토큰이 된다.

      - id: rag.reranker
        label: 리랭커
        used_by: [legal_analyst/search_law, auditor/search_law]
        adapters: [cross-encoder, none]
        default: kure-reranker-nano
        candidates:
          - id: kure-reranker-nano
            label: KURE-Reranker-nano
            adapter: cross-encoder
            ref: nlpai-lab/KURE-Reranker-nano
            license: Apache-2.0
            note: 149M · LawIRKo 0.837 · 482쌍/초 (A6000) (R3)
          - id: qwen3-reranker-4b
            label: Qwen3-Reranker-4B
            adapter: cross-encoder
            ref: Qwen/Qwen3-Reranker-4B
            license: Apache-2.0
            note: LawIRKo 0.877 · 24.3쌍/초 (R3)
          - id: bge-reranker-v2-m3
            label: bge-reranker-v2-m3
            adapter: cross-encoder
            ref: BAAI/bge-reranker-v2-m3
            license: Apache-2.0
            note: LawIRKo 0.791 (R3)
          - id: none
            label: 사용 안 함
            adapter: none
            note: LegalBench-RAG에서 리랭커가 정밀도를 낮춘 사례가 있어 비교 대상으로 둔다 (R3)

      - id: rag.store
        label: 벡터 저장소
        used_by: [legal_analyst/search_law, auditor/search_law]
        adapters: [vector-store]
        default: chroma
        candidates:
          - id: chroma
            label: Chroma (로컬)
            adapter: vector-store
            ref: chroma
            license: Apache-2.0
            note: dense + 메타데이터. 하이브리드 결합은 앱에서 (R3)
          - id: qdrant-local
            label: Qdrant (로컬 모드)
            adapter: vector-store
            ref: qdrant
            license: Apache-2.0
            note: dense + sparse를 서버에서 RRF 결합. 한국어 BM25 토큰은 직접 넣어야 한다 (R3)

      - id: rag.seed
        label: 시드 묶음
        used_by: [legal_analyst/model]
        adapters: [option]
        default: enabled
        candidates:
          - id: enabled
            label: 사용 (핵심 조문 9건 사전 로딩)
            adapter: option
            note: 제2조 · 제15·17조 · 제25조 · 제25조의2 · 제58조 · 제58조의2 · 표준지침 영상 조항 · 가명 가이드라인 영상 절
          - id: disabled
            label: 사용 안 함
            adapter: option
            note: 기능 제거 실험용. 에이전트가 핵심 조문부터 직접 검색한다.

