# 시드 묶음 (설계 §5.2): Legal Analyst가 시작할 때 항상 받는 핵심 조문.
# 지식을 미리 읽혀 주는 것이지 판단 규칙이 아니다. 에이전트는 이 밖의 문서를 자유롭게 검색한다.
# doc은 코퍼스 문서의 인용 표기(또는 문서 ID), units는 그 문서의 단위 ID다.
# 지금 코퍼스에 없는 문서와 단위는 건너뛰고 실행 기록에 남긴다 (코퍼스 선정은 M4-1).
# 프로필의 rag.seed를 disabled로 두면 쓰지 않는다 (반사실 실험에서는 시드도 함께 뺀다).
version: 1
max_chars_per_unit: 1600
bundle:
  - doc: 개인정보 보호법
    units: [제2조, 제15조, 제17조, 제25조, 제25조의2, 제58조, 제58조의2]
  - doc: 표준 개인정보 보호지침
    units: [제2조]
