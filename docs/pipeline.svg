<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">PrivFrame 파이프라인</title><desc id="desc">문서 색인과 영상 분석이 RAG 판단으로 연결되고, 사용자 검토 후 영상이 출력됩니다. 각 단계의 스냅샷에서 재검색 없이 보고서와 평가를 생성합니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#447267" /></marker><marker id="save" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ae8a43" /></marker>
<style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#173c33}.title{font-size:36px;font-weight:700}.sub{font-size:17px;fill:#627b73}.heading{font-size:18px;font-weight:700}.detail{font-size:14px;fill:#536b64}.label{font-size:14px;font-weight:600;fill:#96722e}.step{fill:#fff;stroke:#c7dad1;stroke-width:1.5}.flow{fill:none;stroke:#447267;stroke-width:2;marker-end:url(#arrow)}.persist{fill:none;stroke:#ae8a43;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#save)}</style></defs>
<rect width="1400" height="1000" fill="#f4f7f4" /><text x="60" y="67" class="title">PrivFrame · 실행 흐름과 근거 보존</text>
<text x="60" y="103" class="sub">부품은 교체하고, 실행별 입력·판단·처리 기록은 유지합니다.</text>
<text x="60" y="156" class="label">문서 준비 · 문서/설정 변경 시 새 인덱스</text>
<rect x="60" y="175" width="200" height="90" rx="15" fill="#e6efe9" /><text x="82" y="210" class="heading">공식 원문 · PDF/TXT</text><text x="82" y="239" class="detail">출처 · 문서 버전 · 원문 해시</text>
<path d="M260 220 H285" class="flow" style="marker-end:none" />
<rect x="295" y="175" width="200" height="90" rx="15" fill="#e6efe9" /><text x="317" y="210" class="heading">추출 → 청킹 → 임베딩</text><text x="317" y="239" class="detail">각 알고리즘 어댑터 교체</text>
<path d="M495 220 H520" class="flow" style="marker-end:none" />
<rect x="530" y="175" width="220" height="90" rx="15" fill="#e6efe9" /><text x="551" y="210" class="heading">버전별 검색 인덱스</text><text x="551" y="239" class="detail">문서 · 청킹 · 임베딩 설정 고정</text>
<path d="M640 265 V304 H810 V341" class="flow" style="marker-end:none" />
<text x="60" y="323" class="label">실행 · 자유로운 사용자 상황으로 판단</text>
<rect x="60" y="350" width="180" height="100" rx="15" class="step" /><text x="82" y="384" class="heading">1. 영상 · 상황 입력</text><text x="82" y="411" class="detail">자연어 + 선택 사실</text><text x="82" y="434" class="detail">실행 설정 스냅샷</text><path d="M240 400 H271" class="flow" style="marker-end:none" />
<rect x="280" y="350" width="180" height="100" rx="15" class="step" /><text x="302" y="384" class="heading">2. 얼굴 분석</text><text x="302" y="411" class="detail">정규화 · 검출 · 트래킹</text><text x="302" y="434" class="detail">좌표 · 프레임 기준 고정</text><path d="M460 400 H491" class="flow" style="marker-end:none" />
<rect x="500" y="350" width="180" height="100" rx="15" class="step" /><text x="522" y="384" class="heading">3. 트랙 설명</text><text x="522" y="411" class="detail">본인 · 제3자 등 선택 입력</text><text x="522" y="434" class="detail">미입력은 unknown</text><path d="M680 400 H711" class="flow" style="marker-end:none" />
<rect x="720" y="350" width="180" height="100" rx="15" class="step" /><text x="742" y="384" class="heading">4. RAG 검색</text><text x="742" y="411" class="detail">상황에 맞는 근거 검색</text><text x="742" y="434" class="detail">후보와 실제 입력 구분</text><path d="M900 400 H931" class="flow" style="marker-end:none" />
<rect x="940" y="350" width="180" height="100" rx="15" class="step" /><text x="962" y="384" class="heading">5. 판단 생성</text><text x="962" y="411" class="detail">초기: LLM 직접 판단</text><text x="962" y="434" class="detail">처리 제안 · 근거 ID</text><path d="M1120 400 H1151" class="flow" style="marker-end:none" />
<rect x="1160" y="350" width="180" height="100" rx="15" fill="#faedce" stroke="#dbbc73" /><text x="1182" y="384" class="heading">6. 사용자 검토</text><text x="1182" y="411" class="detail">근거 확인 · 트랙별 수정</text><text x="1182" y="434" class="detail">검토 필요 시 전체 지정</text>
<path d="M1250 450 V531" class="flow" style="marker-end:none" /><text x="1140" y="492" class="detail">확정된 전체 처리 맵</text>
<rect x="1160" y="540" width="180" height="100" rx="15" fill="#dcece3" stroke="#97beab" /><text x="1182" y="574" class="heading">7. 영상 출력</text><text x="1182" y="601" class="detail">KEEP / BLUR</text><text x="1182" y="624" class="detail">MOSAIC / MASK</text>
<path d="M370 450 V641" class="persist" style="marker-end:none" /><text x="388" y="528" class="label">관측 · 위치 · 구간</text>
<path d="M810 450 V641" class="persist" style="marker-end:none" /><text x="829" y="528" class="label">근거 원문 · 출처</text>
<path d="M1030 450 V641" class="persist" style="marker-end:none" /><text x="1047" y="528" class="label">판단 · 사용량</text>
<path d="M1250 640 V710 H1110" class="persist" style="marker-end:none" /><text x="1160" y="691" class="label">수정 · 실제 처리</text>
<rect x="280" y="650" width="820" height="120" rx="20" fill="#fff8e9" stroke="#d2b878" stroke-width="2" /><text x="312" y="691" class="heading">실행별 RunSnapshot · 단계 / 시도별 불변 결과</text>
<text x="312" y="720" class="detail">입력 · 설정 · 문서/모델/코드 버전 · 검색 근거 · 판단 · 사용자 변경 · 실제 렌더 파라미터</text><text x="312" y="746" class="detail">재시작·재색인 후에도 당시 결과를 설명할 수 있도록 보존</text>
<path d="M480 770 V821" class="flow" style="marker-end:none" /><path d="M920 770 V821" class="flow" style="marker-end:none" />
<rect x="280" y="830" width="400" height="100" rx="15" class="step" /><text x="305" y="867" class="heading">JSON · HTML 보고서 / 재생성</text><text x="305" y="897" class="detail">저장된 스냅샷만 읽음 · 재검색/재판단 없음</text>
<rect x="740" y="830" width="360" height="100" rx="15" class="step" /><text x="765" y="867" class="heading">실험 비교 · 평가</text><text x="765" y="897" class="detail">동일 자료 · 다른 부품 / 설정 · 결과 비교</text>
<text x="60" y="972" class="sub">실선 = 처리 흐름    점선 = 실행 근거 보존    사용자 수정은 저장된 관측 결과를 재사용합니다.</text>
<polygon points="285.0,220.0 276.0,216.0 276.0,224.0" fill="#447267" /><polygon points="520.0,220.0 511.0,216.0 511.0,224.0" fill="#447267" /><polygon points="810.0,341.0 814.0,332.0 806.0,332.0" fill="#447267" /><polygon points="271.0,400.0 262.0,396.0 262.0,404.0" fill="#447267" /><polygon points="491.0,400.0 482.0,396.0 482.0,404.0" fill="#447267" /><polygon points="711.0,400.0 702.0,396.0 702.0,404.0" fill="#447267" /><polygon points="931.0,400.0 922.0,396.0 922.0,404.0" fill="#447267" /><polygon points="1151.0,400.0 1142.0,396.0 1142.0,404.0" fill="#447267" /><polygon points="1250.0,531.0 1254.0,522.0 1246.0,522.0" fill="#447267" /><polygon points="370.0,641.0 374.0,632.0 366.0,632.0" fill="#ae8a43" /><polygon points="810.0,641.0 814.0,632.0 806.0,632.0" fill="#ae8a43" /><polygon points="1030.0,641.0 1034.0,632.0 1026.0,632.0" fill="#ae8a43" /><polygon points="1110.0,710.0 1119.0,714.0 1119.0,706.0" fill="#ae8a43" /><polygon points="480.0,821.0 484.0,812.0 476.0,812.0" fill="#447267" /><polygon points="920.0,821.0 924.0,812.0 916.0,812.0" fill="#447267" /></svg>